<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Web Page</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        
#main-heading {
  color:blue;
  text-align: center;
}

.text {
  background-color: lightgray;
}

    </style>    
</head>
<body>
<table>
    <tr>
        <th>Heading 1</th>
        <th>Heading 2</th>
    </tr>
    <tr>
        <td>Row 1</td>
        <td>Row 1</td>
    </tr>
    <tr>
        <td>Row 2</td>
        <td>Row 2</td>
    </tr>
</table>
<br><br>
<table>
    <tr>
        <td>row 1</td>
        <td>row 1</td>
        <td>row 1</td>
    </tr>
    <tr>
        <td colspan="3">3 columns</td>
    </tr>   
    </tr>
    <tr>
        <td rowspan="2">2 rows</td>
        <td>row 3</td>
        <td>row 3</td>
    </tr>
    <tr>
        <td>row 4</td>
        <td>row 4</td>
    </tr>
</table>
<br><br>
<!--this is a table-->
<table>

        <tr>
            <td></td>

        </tr>

        <tr>

        </tr>

            <th scope="row">Row heading 2</th>

            <td></td>

</table>
